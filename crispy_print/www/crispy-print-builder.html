{% extends "templates/web.html" %}

{% block title %}Crispy Print Builder{% endblock %}

{% block head_include %}
<style>
	body {
		margin: 0;
		padding: 0;
		overflow: hidden;
	}
	.page-content-wrapper {
		padding: 0 !important;
	}
	.page-card {
		box-shadow: none !important;
		margin: 0 !important;
	}
</style>
{% endblock %}

{% block page_content %}
<div id="crispy-print-root"></div>
{% endblock %}

{% block script %}
<script>
	frappe.ready(() => {
		// Mount the Vue app when page is ready
		if (window.mountCrispyPrint) {
			window.mountCrispyPrint("#crispy-print-root")
		} else {
			console.error("mountCrispyPrint function not found. Make sure the bundle is loaded.")
		}
	})
</script>
{% endblock %}
