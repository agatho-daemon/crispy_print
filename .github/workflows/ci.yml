
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-crispy_print-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Frappe v15
            frappe_branch: version-15
            payments_branch: version-15
            python_version: '3.11'
          - target: Frappe v16
            frappe_branch: version-16
            payments_branch: version-16
            python_version: '3.14'
          - target: Frappe dev-17
            frappe_branch: develop
            payments_branch: develop
            python_version: '3.14'
    name: Server / ${{ matrix.target }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Verify vendored Typst packages
        run: python scripts/verify_typst_packages.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe_branch }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch "${{ matrix.payments_branch }}" payments https://github.com/frappe/payments.git
          bench get-app --branch "${{ matrix.frappe_branch }}" erpnext https://github.com/frappe/erpnext.git
          bench get-app crispy_print $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app payments
          bench --site test_site install-app erpnext
          bench --site test_site install-app crispy_print
          bench --site test_site migrate
          bench --site test_site migrate
          bench build --app crispy_print
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app crispy_print
        env:
          TYPE: server
